ls need a code gate and usually a human.", "show": "Look tools run free; change tools are gated"}, {"say": "The most dangerous actions I simply do not register. A tool that is not in the list cannot be called by any prompt, injected or otherwise.", "show": "Not registered means no prompt can call it"}]}, {"kind": "stage", "kicker": "CONCEPT 3 OF 3 · THE STORY", "title": "The ticket barrier", "stage": {"cols": 4, "rows": 2, "nodes": [{"id": "pass", "label": "Passenger", "sub": "very sure of himself", "col": 0, "row": 0}, {"id": "barrier", "label": "Ticket barrier", "sub": "a machine, not a guess", "col": 1, "row": 0}, {"id": "train", "label": "Platform", "sub": "board the train", "col": 3, "row": 0}, {"id": "c1", "label": "Right train?", "sub": "ticket for this route", "col": 1, "row": 1}, {"id": "c2", "label": "Ticket genuine?", "sub": "real and his own", "col": 2, "row": 1}, {"id": "c3", "label": "Within zone?", "sub": "fare rules", "col": 3, "row": 1}], "routes": [["pass", "barrier"], ["barrier", "c1"], ["c1", "c2"], ["c2", "c3"], ["c3", "train"]]}, "beats": [{"say": "A passenger walks up to a ticket barrier. He says, very confidently, that he belongs on the express.", "show": "He sounds very sure", "cap": "A confident passenger", "on": ["pass"], "done": [], "mover": {"label": "ticket", "at": "pass"}}, {"say": "The barrier does not care how sure he sounds. It is a machine that checks facts.", "show": "Confidence does not open the gate", "cap": "The barrier checks facts", "on": ["barrier"], "done": ["pass"], "mover": {"label": "ticket", "at": "barrier"}}, {"say": "First, is this ticket for this route at all? A local ticket does not open the express gate.", "show": "Check one: the right train", "cap": "Right train?", "on": ["c1"], "done": ["barrier"], "mover": {"label": "ticket", "at": "c1"}}, {"say": "Next, is the ticket real, and is it his? Then, is the trip within the fare zone he paid for?", "show": "Check two and three: genuine, within limits", "cap": "Genuine and in zone?", "on": ["c2", "c3"], "done": ["c1", "c2", "c3"], "mover": {"label": "ticket", "at": "c3"}}, {"say": "Only when every check passes does the gate open. If any check fails, staff ask him what he meant.", "show": "All checks pass, or someone asks", "cap": "The gate opens", "on": ["train"], "done": ["train"], "mover": {"label": "ticket", "at": "train"}}]}, {"kind": "stage", "kicker": "CONCEPT 3 OF 3 · THE REAL THING", "title": "The code gate checks three things", "stage": {"cols": 4, "rows": 2, "nodes": [{"id": "model", "label": "Model", "sub": "proposes a call", "col": 0, "row": 0}, {"id": "gate", "label": "Code gate", "sub": "outside the model", "col": 1, "row": 0}, {"id": "run", "label": "Run or approve", "sub": "tool or human", "col": 3, "row": 0}, {"id": "intent", "label": "Intent check", "sub": "tool allowed here?", "col": 1, "row": 1}, {"id": "rec", "label": "Records check", "sub": "order, owner, amount", "col": 2, "row": 1}, {"id": "pol", "label": "Policy limit", "sub": "within the cap?", "col": 3, "row": 1}], "routes": [["model", "gate"], ["gate", "intent"], ["intent", "rec"], ["rec", "pol"], ["pol", "run"]]}, "beats": [{"say": "A user asks to track an order. The model calls refund instead, for forty-eight thousand rupees, very confidently.", "show": "Asked to track, the model proposes a refund", "cap": "A confident wrong call", "on": ["model"], "done": [], "mover": {"label": "refund", "at": "model"}}, {"say": "A code gate is a deterministic check outside the model. It runs before anything executes or reaches a human. Model confidence is not an input.", "show": "Deterministic, outside the model, before anything runs", "cap": "The code gate", "on": ["gate"], "done": [], "mover": {"label": "refund", "at": "gate"}}, {"say": "First, is this tool allowed at this step of this intent? Tracking an order does not permit a refund.", "show": "Check one: is the tool allowed for this intent?", "cap": "Intent check", "on": ["intent"], "done": [], "mover": {"label": "refund", "at": "intent"}}, {"say": "Second, do the arguments match real records? The order must exist and belong to this user. The amount must fit the refundable amount.", "show": "Check two: arguments match real records", "cap": "Records check", "on": ["rec"], "done": [], "mover": null}, {"say": "Third, is the action within policy limits?", "show": "Check three: within policy limits", "cap": "Policy limit", "on": ["pol"], "done": [], "mover": null}, {"say": "Here the intent check fails. The gate rejects the call and asks the user what they meant. Nothing runs.", "show": "On mismatch: reject and ask the user", "cap": "Rejected, ask the user", "on": ["intent"], "done": [], "mover": {"label": "refund", "at": "intent"}, "blocked": ["intent>rec"]}, {"say": "Only a call that passes all three reaches the tool or a human reviewer.", "show": "Only checked calls reach a person", "cap": "Pass all three", "on": ["run"], "done": ["intent", "rec", "pol", "run"], "mover": {"label": "call", "at": "run"}}]}, {"kind": "code", "kicker": "CONCEPT 3 OF 3 · CODE", "title": "Allowed tools and real records", "code": "from types import SimpleNamespace as NS\nPOLICY_MAX_INR = 50_000\nALLOWED = {\n    \"track_order\":\n        {\"get_order\", \"get_shipment\"},\n    \"refund_request\":\n        {\"get_order\", \"propose_refund\"},\n}\norders = {\"A1\": NS(owner=\"u1\",\n                   refundable_inr=48_000)}", "beats": [{"say": "SimpleNamespace stands in for real order records. The policy cap is fifty thousand rupees.", "show": "Policy cap: 50,000 rupees", "hl": [1, 2]}, {"say": "ALLOWED maps each intent to the tools it permits. Track order allows get order and get shipment. Only refund request allows propose refund.", "show": "Each intent permits only its own tools", "hl": [3, 4, 5, 6, 7, 8]}, {"say": "One sample order, A one, owned by user u one. Its refundable amount is forty-eight thousand.", "show": "One real order to check against", "hl": [9, 10]}]}, {"kind": "code", "kicker": "CONCEPT 3 OF 3 · CODE", "title": "The gate function", "code": "def gate(intent, tool, args, uid):\n    if tool not in ALLOWED.get(intent, set()):\n        return False, f\"{tool} not allowed\"\n    if tool == \"propose_refund\":\n        order = orders.get(args.order_id)\n        if not order or order.owner != uid:\n            return False, \"order not found\"\n        limit = min(order.refundable_inr,\n                    POLICY_MAX_INR)\n        if not 0 < args.amount_inr <= limit:\n            return False, \"amount over limit\"\n    return True, \"ok\"", "beats": [{"say": "The gate takes the intent, the tool, its arguments, and the user. If the tool is not listed for this intent, it rejects straight away.", "show": "Reject tools the intent does not allow", "hl": [1, 2, 3]}, {"say": "For a refund, it looks up the real order. A missing order, or one owned by someone else, is rejected.", "show": "The order must exist and belong to the user", "hl": [4, 5, 6, 7]}, {"say": "The limit is the smaller of the refundable amount and the policy cap. Partial refunds are fine, up to that limit.", "show": "Amount within refundable amount and policy cap", "hl": [8, 9, 10, 11]}, {"say": "Only then does it return ok. One more rule: the intent should come from a constrained classifier or the UI flow, not from the same free-form turn that proposed the tool.", "show": "Intent comes from a classifier or UI flow", "hl": [12]}]}, {"kind": "gotcha", "kicker": "CONCEPT 3 OF 3 · TRAP", "title": "Fixing the surprise refund", "question": "The model proposed a refund for a tracking request. What is the right fix?", "options": ["Send every unchecked call to a human", "A stronger instruction in the system prompt", "A code gate checking intent and records"], "answer": 2, "beats": [{"say": "The model proposed a refund when the user only asked to track an order. What is the right fix? Option A: Send every unchecked call to a human. Option B: A stronger instruction in the system prompt. Or option C: A code gate checking intent and records.", "show": ""}, {"say": "Pause the video. Think it through for a moment. Drop your answer in the comments with the on-screen timestamp.", "show": "", "wait": 4}, {"say": "It is option C. A code gate that checks intent, records, and policy. A stronger prompt loses to a stronger injected instruction. And sending unchecked calls to humans floods reviewers, so approval becomes a rubber stamp.", "show": "Gate in code; never send humans unchecked calls"}], "stamp": "9:23"}, {"kind": "say", "kicker": "CONCEPT 3 OF 3 · INTERVIEW", "title": "Say it in the interview", "beats": [{"say": "Confidence is not evidence. Before any human sees a proposed call, a code gate checks it.", "show": "Confidence is not evidence."}, {"say": "It checks the tool is allowed for this intent, the arguments match the real order, and the amount fits the refundable amount and policy limit. On any mismatch, it rejects and asks the user.", "show": "Check intent, records, and policy limits"}, {"say": "A prompt can say only refund eligible orders, but a prompt is a suggestion. Prompts guide, code enforces.", "show": "Prompts guide, code enforces."}]}, {"kind": "lab", "kicker": "LAB", "title": "Type a tiny code gate", "code": "ALLOWED = {\"track\": {\"get_order\"},\n           \"refund\": {\"get_order\", \"refund\"}}\norders = {(\"A1\", \"u1\"): 48_000}\ndef gate(intent, oid, amt, uid):\n    cap = orders.get((oid, uid))\n    if \"refund\" not in ALLOWED[intent]:\n        return \"reject: not allowed\"\n    if cap is None: return \"reject: no order\"\n    if not 0 < amt <= min(cap, 50_000):\n        return \"reject: over limit\"\n    return \"ok: send to human\"\nprint(gate(\"track\", \"A1\", 48_000, \"u1\"))\nprint(gate(\"refund\", \"A1\", 60_000, \"u1\"))\nprint(gate(\"refund\", \"A1\", 48_000, \"u1\"))", "output": "reject: not allowed\nreject: over limit\nok: send to human", "beats": [{"say": "Code along with me, or just watch and try it after. This is a tiny offline gate with three test calls.", "show": "A small gate, three test calls"}, {"say": "First, a refund during a tracking intent. Rejected, because that tool is not allowed for that intent.", "show": "Wrong intent is rejected", "out": 1}, {"say": "Next, sixty thousand rupees on the real order. Rejected, because it is above the refundable amount.", "show": "Too large an amount is rejected", "out": 2}, {"say": "Last, forty-eight thousand by the real owner, in a refund intent. It passes, and only now goes to a human.", "show": "A checked call reaches a human", "out": 3}]}, {"kind": "recap", "kicker": "NO API KEY NEEDED", "title": "Try it free in your browser", "beats": [{"say": "No A P I key? You can still try this for free, in your browser.", "show": ""}, {"say": "Gandalf is a game where you try to trick a model into revealing a password. It is the fastest way to feel prompt injection.", "show": "Gandalf · gandalf.lakera.ai"}, {"say": "The links are in the description.", "show": "Links are in the description"}]}, {"kind": "recap", "kicker": "RECAP", "title": "What to remember", "beats": [{"say": "Ask whose identity a tool runs as. Default to delegated, so the downstream API enforces the user's permissions.", "show": "Delegated by default; never app-only plus a model"}, {"say": "Split tools by risk. Look tools run freely, change tools are gated, destructive tools are not registered.", "show": "Look free, gate changes, drop destructive tools"}, {"say": "A code gate checks intent, records, and policy before anything runs or reaches a human.", "show": "Prompts guide, code enforces"}]}, {"kind": "homework", "kicker": "HOMEWORK", "title": "Your tasks for today", "beats": [{"say": "Run the lab gate, then add a test call with the wrong user.", "show": "Run the lab, add a wrong-user call"}, {"say": "List the tools of an agent you know, and tag each one read-only, reversible, or irreversible.", "show": "Tag each tool by its risk tier"}, {"say": "For each tool, write down who
